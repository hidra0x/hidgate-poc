name: build-applejpeg-poc

on:
  push:
    branches: [main]
    paths:
      - "PoC/applejpeg/**"
      - "scripts/package_ipa.py"
      - ".github/workflows/build-applejpeg.yml"
  pull_request:
    paths:
      - "PoC/applejpeg/**"
      - "scripts/package_ipa.py"
      - ".github/workflows/build-applejpeg.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          chmod +x PoC/applejpeg/build.sh
          ./PoC/applejpeg/build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: moonprobe-unsigned-ipa
          path: build/MOONProbe-unsigned.ipa
